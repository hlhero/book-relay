{% extends "base.html" %}
{% block content %}
<div class="card form-card">
  <h1>找回密码</h1>
  <p class="muted">填写注册邮箱与安全问题答案，直接设置新密码。</p>
  <form id="forgot-form">
    <label class="field"><span>注册邮箱</span><input name="email" type="email" required></label>
    <label class="field"><span>安全问题答案</span><input name="security_answer" required></label>
    <label class="field"><span>新密码（至少 8 位）</span><input name="new_password" type="password" minlength="8" required></label>
    <button class="btn block" type="submit">重置密码</button>
  </form>
  <p class="center small" style="margin-top:18px"><a href="/login">返回登录</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
$('#forgot-form').addEventListener('submit', async e => {
  e.preventDefault(); const btn = $('button[type=submit]', e.target); busy(btn, true);
  try { await api('/api/v1/auth/reset-password', {method:'POST', body:Object.fromEntries(new FormData(e.target))});
    toast('密码已重置，请重新登录', 'ok'); setTimeout(() => go('/login'), 600); }
  catch (err) { toast(err.message, 'err'); busy(btn, false); }
});
</script>
{% endblock %}
