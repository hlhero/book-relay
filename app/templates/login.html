{% extends "base.html" %}
{% block content %}
<div class="card form-card">
  <h1>欢迎回来</h1>
  <p class="muted">登录后即可下单、查看订单状态与站内消息。</p>
  <form id="login-form">
    <label class="field"><span>邮箱</span><input name="email" type="email" autocomplete="username" required value="lin@bookrelay.local"></label>
    <label class="field"><span>密码</span><input name="password" type="password" autocomplete="current-password" required value="Student@123"></label>
    <p class="hint">演示学生账号已预填；管理员：admin@bookrelay.local / Admin@135</p>
    <button class="btn block" type="submit">登录</button>
  </form>
  <p class="center small" style="margin-top:18px"><a href="/forgot">找回密码</a> · 还没有账号？<a href="/register">立即注册</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('button[type=submit]', e.target); busy(btn, true);
  try {
    const form = new FormData(e.target);
    await api('/api/v1/auth/login', {method:'POST', body:{email:form.get('email'), password:form.get('password')}});
    toast('登录成功', 'ok'); go({{ next_url|tojson }});
  } catch (err) { toast(err.message, 'err'); busy(btn, false); }
});
</script>
{% endblock %}
