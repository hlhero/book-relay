{% extends "base.html" %}
{% block content %}
<div class="section-head"><div><h1>后台运营</h1><p class="muted">内容审核、退款纠纷、举报处理与数据看板。</p></div></div>
<nav class="tabs">
  <a href="/admin?tab=overview" class="{{ 'active' if tab == 'overview' }}">数据看板</a>
  <a href="/admin?tab=books" class="{{ 'active' if tab == 'books' }}">书籍审核</a>
  <a href="/admin?tab=refunds" class="{{ 'active' if tab == 'refunds' }}">退款处理</a>
  <a href="/admin?tab=reports" class="{{ 'active' if tab == 'reports' }}">举报处理</a>
  <a href="/admin?tab=users" class="{{ 'active' if tab == 'users' }}">用户管理</a>
</nav>
<div class="card" id="admin-panel"><div class="loading show"><div class="spinner"></div>正在加载后台数据…</div></div>
{% endblock %}
{% block scripts %}
<script>
const tab = {{ tab|tojson }};
const ORDER_LABELS = {{ ORDER_LABELS|tojson }};
const yuan = cents => (Number(cents) / 100).toFixed(2);
const panel = $('#admin-panel');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const empty = msg => `<div class="empty"><div class="icon">✅</div><h3>${msg}</h3><p>当前没有需要处理的条目。</p></div>`;
const table = (heads, rows) => `<div class="tbl-wrap"><table><thead><tr>${heads.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
const btn = (action, id, label, style = 'secondary') =>
  `<button class="btn sm ${style}" data-action="${action}" data-id="${id}">${label}</button>`;

async function renderOverview() {
  const d = await api('/api/v1/admin/dashboard');
  const cards = [['注册用户', d.users], ['在售教材', d.books_on_sale], ['全部订单', d.orders],
    ['累计支付', '¥' + yuan(d.revenue_cents)], ['待审核书籍', d.pending_books],
    ['待处理退款', d.pending_refunds], ['待处理举报', d.pending_reports]];
  const stats = `<div class="grid books" style="margin-bottom:20px">${cards.map(([k,v]) =>
    `<div class="card tight center"><div class="small muted">${k}</div><div style="font-size:28px;font-weight:750;color:var(--green)">${v}</div></div>`).join('')}</div>`;
  const rows = d.recent_orders.map(o => `<tr><td>${esc(o.order_no)}</td><td>${esc(o.buyer_nickname)}</td>
    <td>${esc(ORDER_LABELS[o.status] || o.status)}</td><td>¥${yuan(o.total_cents)}</td><td>${esc(o.created_at)}</td>
    <td><a class="btn sm secondary" href="/orders/${o.id}">查看</a></td></tr>`);
  panel.innerHTML = stats + '<h3>最近订单</h3>' + (rows.length ? table(['订单号','买家','状态','金额','创建时间','操作'], rows) : empty('暂无订单'));
}
async function renderBooks() {
  const items = await api('/api/v1/admin/books');
  const rows = items.map(b => `<tr><td>${esc(b.title)}</td><td>${esc(b.seller_nickname)}</td><td>${esc(b.category_name)}</td>
    <td>¥${b.price_text}</td><td>${esc(b.condition_text)}</td><td>${btn('book-approve',b.id,'通过')} ${btn('book-reject',b.id,'驳回')}</td></tr>`);
  panel.innerHTML = '<h3>待审核书籍</h3>' + (rows.length ? table(['书名','卖家','分类','价格','成色','操作'], rows) : empty('全部审核完毕'));
}
async function renderRefunds() {
  const items = (await api('/api/v1/admin/refunds')).filter(r => r.status === 'PENDING');
  const rows = items.map(r => `<tr><td>${esc(r.order_no)}</td><td>${esc(r.applicant_nickname)}</td><td>¥${yuan(r.amount_cents)}</td>
    <td>${esc(r.reason)}</td><td>${esc(r.evidence || '—')}</td><td>${btn('refund-approve',r.id,'同意')} ${btn('refund-reject',r.id,'驳回','danger')}</td></tr>`);
  panel.innerHTML = '<h3>待处理退款申请</h3>' + (rows.length ? table(['订单号','申请人','金额','原因','纠纷说明','操作'], rows) : empty('没有待处理退款'));
}
async function renderReports() {
  const items = (await api('/api/v1/admin/reports')).filter(r => r.status === 'PENDING');
  const rows = items.map(r => `<tr><td>${esc(r.reporter_nickname)}</td><td>${esc(r.target_type)} #${r.target_id}</td>
    <td>${esc(r.reason)}</td><td>${esc(r.detail || '—')}</td><td>${btn('report-resolve',r.id,'举报成立')} ${btn('report-reject',r.id,'驳回','danger')}</td></tr>`);
  panel.innerHTML = '<h3>待处理举报</h3>' + (rows.length ? table(['举报人','目标','原因','说明','操作'], rows) : empty('没有待处理举报'));
}
async function renderUsers() {
  const items = await api('/api/v1/admin/users');
  const rows = items.map(u => `<tr><td>#${u.id}</td><td>${esc(u.nickname)}</td><td>${esc(u.email)}</td>
    <td>${esc(u.role)}</td><td>★ ${u.reputation}</td><td>${u.deal_count}</td>
    <td>${u.status === 'banned' ? '<span class="tag bad">已封禁</span>' : '<span class="tag">正常</span>'}</td>
    <td>${u.role === 'admin' ? '—' : btn(u.status === 'banned' ? 'user-unban' : 'user-ban', u.id, u.status === 'banned' ? '解封' : '封禁', u.status === 'banned' ? 'secondary' : 'danger')}</td></tr>`);
  panel.innerHTML = '<h3>用户列表</h3>' + table(['ID','昵称','邮箱','角色','信誉','交易数','状态','操作'], rows);
}

async function reload() {
  panel.innerHTML = '<div class="loading show"><div class="spinner"></div>正在加载…</div>';
  try {
    await ({overview:renderOverview, books:renderBooks, refunds:renderRefunds, reports:renderReports, users:renderUsers}[tab] || renderOverview)();
  } catch (err) { panel.innerHTML = `<div class="notice bad">加载失败：${esc(err.message)}</div>`; }
}

panel.addEventListener('click', async e => {
  const target = e.target.closest('[data-action]'); if (!target) return;
  const {action, id} = target.dataset;
  let note = '';
  if (['book-reject','refund-reject','report-reject','user-ban'].includes(action)) {
    const v = await fieldModal('请填写处理说明', [{name:'note', label:'说明', type:'textarea', required:true}], '确认');
    if (!v) return; note = v.note;
  }
  try {
    if (action.startsWith('book-')) await api(`/api/v1/books/${id}/actions/${action === 'book-approve' ? 'approve' : 'reject'}`,
      {method:'POST', body:{reason:note}});
    else if (action.startsWith('refund-')) await api(`/api/v1/admin/refunds/${id}`,
      {method:'POST', body:{approve:action === 'refund-approve', note}});
    else if (action.startsWith('report-')) await api(`/api/v1/admin/reports/${id}`,
      {method:'POST', body:{approve:action === 'report-resolve', note}});
    else if (action.startsWith('user-')) await api(`/api/v1/admin/users/${id}/status`,
      {method:'POST', body:{status:action === 'user-ban' ? 'banned' : 'active'}});
    toast('处理成功', 'ok'); reload();
  } catch (err) { toast(err.message, 'err'); }
});

reload();
</script>
{% endblock %}
